name: Phase 3 Regression

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyGithub
      - name: Phase 3 topic guard tests
        run: python -m scripts.test_recent_topic_guard
      - name: Phase 3.1 tag policy tests
        run: python -m scripts.test_tag_policy
      - name: Runtime title and image quality regression
        run: python -m scripts.test_runtime_quality_regression
      - name: Safe Mode Content Engine V2 regression
        run: python -m scripts.test_safe_content_engine_v2
      - name: Compile policy modules
        run: python -m py_compile agents/recent_topic_guard.py agents/tag_policy.py agents/runtime_guard.py agents/image_selector.py agents/safe_content_engine_v2.py agents/content_enricher.py scripts/test_runtime_quality_regression.py scripts/test_safe_content_engine_v2.py
