name: Auto Blog Post

on:
  schedule:
    - cron: '0 0 * * 2'   # Tuesday 09:00 KST
    - cron: '0 0 * * 4'   # Thursday 09:00 KST
    - cron: '0 0 * * 6'   # Saturday 09:00 KST

  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'once'
        type: choice
        options:
          - once
          - dry-run

jobs:
  auto-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLOG_GITHUB_TOKEN: ${{ secrets.BLOG_GITHUB_TOKEN }}
      BLOG_REPO: ajinnetworks/ajinnetworks.github.io
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      LOG_LEVEL: "INFO"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install anthropic PyGithub python-frontmatter requests PyYAML python-dotenv schedule google-genai

      - name: Create .env file
        run: |
          cat > .env << EOF
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_GITHUB_TOKEN=${{ secrets.BLOG_GITHUB_TOKEN }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          BLOG_REPO=ajinnetworks/ajinnetworks.github.io
          HUMAN_GATE=false
          LOG_LEVEL=INFO
          PYTHONUTF8=1
          PYTHONIOENCODING=utf-8
          EOF

      - name: Patch deprecated Gemini model IDs
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('agents/trend_agent.py'),
              Path('agents/writer_agent.py'),
              Path('agents/reviewer_agent.py'),
          ]
          replacements = {
              'gemini-2.0-flash-lite': 'gemini-2.5-flash-lite',
              'gemini-2.0-flash': 'gemini-2.5-flash',
          }
          for path in files:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
              print(f'patched: {path}')
          PY

      - name: Validate patched model IDs
        run: |
          grep -R "gemini-2.5-flash" agents/trend_agent.py agents/writer_agent.py agents/reviewer_agent.py
          if grep -R "gemini-2.0-flash" agents/trend_agent.py agents/writer_agent.py agents/reviewer_agent.py; then
            echo "Deprecated Gemini model ID remains"
            exit 1
          fi

      - name: Generate and publish blog post
        run: |
          MODE="${{ github.event.inputs.mode || 'once' }}"
          echo "Execution mode: $MODE"
          python scripts/run_agent.py --mode "$MODE" --platform github

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: blog-logs-${{ github.run_number }}
          path: output/logs/
          retention-days: 30
