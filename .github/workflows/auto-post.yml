name: Auto Blog Post

on:
  schedule:
    - cron: '0 0 * * 2'   # Tuesday 09:00 KST
    - cron: '0 0 * * 4'   # Thursday 09:00 KST
    - cron: '0 0 * * 6'   # Saturday 09:00 KST

  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'once'
        type: choice
        options:
          - once
          - dry-run

jobs:
  auto-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLOG_GITHUB_TOKEN: ${{ secrets.BLOG_GITHUB_TOKEN }}
      BLOG_REPO: ajinnetworks/ajinnetworks.github.io
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      LOG_LEVEL: "INFO"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install anthropic PyGithub python-frontmatter requests PyYAML python-dotenv schedule google-genai

      - name: Create .env file
        run: |
          cat > .env << EOF
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          BLOG_GITHUB_TOKEN=${{ secrets.BLOG_GITHUB_TOKEN }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          BLOG_REPO=ajinnetworks/ajinnetworks.github.io
          HUMAN_GATE=false
          LOG_LEVEL=INFO
          PYTHONUTF8=1
          PYTHONIOENCODING=utf-8
          EOF

      - name: Enable multi-provider LLM fallback
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              Path('agents/trend_agent.py'),
              Path('agents/writer_agent.py'),
              Path('agents/reviewer_agent.py'),
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              marker = 'logger = logging.getLogger(__name__)'
              injection = (
                  marker
                  + '\n\nfrom agents.llm_fallback import get_llm_response as _shared_llm_response\n'
              )
              if 'from agents.llm_fallback import get_llm_response as _shared_llm_response' not in text:
                  text = text.replace(marker, injection, 1)
              text = text.replace('def get_gemini_response(prompt: str) -> str:', 'def _legacy_get_gemini_response(prompt: str) -> str:', 1)
              anchor = '\ndef load_config() -> dict:'
              wrapper = '\ndef get_gemini_response(prompt: str) -> str:\n    return _shared_llm_response(prompt)\n\n'
              if wrapper.strip() not in text:
                  text = text.replace(anchor, wrapper + anchor, 1)
              path.write_text(text, encoding='utf-8')
              print(f'fallback enabled: {path}')
          PY

      - name: Validate LLM fallback wiring
        run: |
          grep -R "llm_fallback" agents/trend_agent.py agents/writer_agent.py agents/reviewer_agent.py
          python -m py_compile agents/llm_fallback.py agents/trend_agent.py agents/writer_agent.py agents/reviewer_agent.py

      - name: Enforce Ajin industrial safe-mode
        run: |
          python scripts/test_safe_mode.py

      - name: Generate and publish blog post
        run: |
          MODE="${{ github.event.inputs.mode || 'once' }}"
          echo "Execution mode: $MODE"
          python scripts/run_agent.py --mode "$MODE" --platform github

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: blog-logs-${{ github.run_number }}
          path: output/logs/
          retention-days: 30
